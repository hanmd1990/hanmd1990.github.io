name: Migrate and deploy laboratory website
on:
  workflow_dispatch:
  push:
    paths:
      - 'work/*.mjs'
      - '.github/workflows/publish.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: laboratory-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the existing snapshot or capture the original website
        run: |
          if [ -f index.html ]; then
            mkdir -p outputs/hmd-lab-site
            git archive HEAD | tar -x -C outputs/hmd-lab-site
          else
            node work/mirror.mjs
            node work/complete-mirror.mjs
            node work/finalize.mjs
            cp -a outputs/hmd-lab-site/. ./
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Save laboratory website snapshot"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/hmd-lab-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
