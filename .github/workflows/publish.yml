name: Deploy laboratory website
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: laboratory-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.0
      - name: Convert the original snapshot once
        run: |
          if [ ! -f independence-report.json ]; then
            python tools/independent.py . "$RUNNER_TEMP/independent-site"
            python tools/verify_site.py "$RUNNER_TEMP/independent-site"
            git rm -r --ignore-unmatch assets vendor migration-navigation.js work/mirror.mjs work/complete-mirror.mjs work/finalize.mjs
            cp -a "$RUNNER_TEMP/independent-site"/. .
            git add '*.html' images static MAINTENANCE.md independence-report.json .nojekyll
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace platform runtime with independent static pages and organized images'
            git push origin HEAD:main
          fi
      - name: Verify and package independent website
        run: |
          python tools/verify_site.py .
          mkdir -p outputs/hmd-lab-site
          git archive HEAD | tar -x -C outputs/hmd-lab-site --exclude='.github' --exclude='work' --exclude='tools' --exclude='.gitignore' --exclude='README.md'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/hmd-lab-site
      - uses: actions/deploy-pages@v4
        id: deployment
